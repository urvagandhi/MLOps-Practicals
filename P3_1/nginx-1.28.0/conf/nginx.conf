    # SCENARIO 10 : Serve Static Files directly with Nginx
    server {
        listen       80;
        server_name  localhost 172.16.0.2;

        # Serve static assets directly from html/static directory
        location /static/ {
            root "/home/urva/Downloads/Academics/Semester - 7/MLOps/Practicals/P3_1";
            alias html/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            proxy_pass http://127.0.0.1:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }

    # SCENARIO 11 : Configure Load Balancing for 2 Flask Apps
    upstream flask_app_1 {
        server 127.0.0.1:5000;
        server 127.0.0.1:5001;
    }
    
    server {
        listen       80;
        server_name  localhost 172.16.0.2;

        # Serve static assets directly from html/static directory
        location /static/ {
            root "/home/urva/Downloads/Academics/Semester - 7/MLOps/Practicals/P3_1";
            alias html/static/;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        location / {
            proxy_pass http://flask_app_1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

