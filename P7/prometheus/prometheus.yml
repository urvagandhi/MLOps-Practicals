global:
  scrape_interval: 10s
  evaluation_interval: 15s

rule_files:
  - "rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093", "localhost:9093", "host.docker.internal:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node_or_windows_exporter"
    static_configs:
      - targets: ["node_exporter:9100", "localhost:9182", "host.docker.internal:9182"]

  - job_name: "webapp"
    metrics_path: /metrics
    static_configs:
      - targets: ["webapp:8000", "localhost:8000", "host.docker.internal:8000"]

  - job_name: "dbapp"
    metrics_path: /metrics
    static_configs:
      - targets: ["dbapp:8001", "localhost:8001", "host.docker.internal:8001"]
