services:
  dbapp:
    build:
      context: .
      dockerfile: flask_apps/dbapp/Dockerfile
    container_name: p7_dbapp
    ports:
      - "8001:8001"
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: flask_apps/webapp/Dockerfile
    container_name: p7_webapp
    environment:
      - DB_SERVICE_URL=http://dbapp:8001/add_record
    ports:
      - "8000:8000"
    depends_on:
      - dbapp
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: p7_prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: p7_alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:latest
    container_name: p7_node_exporter
    ports:
      - "9100:9100"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: p7_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped
