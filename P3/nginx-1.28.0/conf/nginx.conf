
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    server {
        # listen       80               
        # Listen All the Ports, like doing local host or 127.0.0.1 or even IPv4 will go to PORT 80, and all will work
        listen       172.16.0.2:80;
        # It will only work for this IPaddress and port combination, not all


        # server_name  localhost;
        # server_name  172.16.0.2;
        # Same behaviour is seen here in both as both automatically redirects to PORT 80, and in listen it should be only 80

        # Scenario 4 : Single App, Single Server Block, 2 Domain
        # server_name  abcd.com api.abcd.com;

        # Scenario 5 : Single App, 2 Server Block, 2 Domain
        server_name  abcd.com;

        

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            proxy_pass http://localhost:5000;
            proxy_set_header Host $host;
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

